<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KavachAI</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      flex-direction: column;
    }
    
    .logo-container {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }
    
    .logo {
      max-width: 200px;
      height: auto;
    }
    
    .button {
      background-color: #0c3683;
      color: white;
      padding: 12px 30px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.3s;
    }
    
    .button:hover {
      background-color: #0a2a68;
    }
    
    .page-border {
      border-bottom: 1px solid #ccc;
      width: 100%;
      position: absolute;
      bottom: 0;
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <img src="/static/images/kavach.png" alt="KavachAI Logo" class="logo">
  </div>
  
  <a href="/home" class="button">KavachAI</a>
  
  <div class="page-border"></div>
</body>
</html>
